<form [formGroup]="form" (ngSubmit)="save()" class="min-w-0 space-y-4">
  <div class="space-y-2">
    <label for="santier-adresa" class="text-sm font-medium text-neutral-700">Adresă</label>
    <input z-input id="santier-adresa" formControlName="adresa" placeholder="Adresa șantierului" [zStatus]="form.get('adresa')?.invalid && form.get('adresa')?.touched ? 'error' : undefined" />
  </div>
  <div class="space-y-2">
    <label for="santier-descriere" class="text-sm font-medium text-neutral-700">Descriere (opțional)</label>
    <textarea id="santier-descriere" formControlName="descriere" rows="3" class="w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-neutral-900 focus:border-primary focus:outline focus:ring-1 focus:ring-primary" placeholder="Descriere"></textarea>
  </div>
  @if (formError()) {
    <z-alert zType="destructive" [zDescription]="formError()!" />
  }
  <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
    <button z-button type="button" zType="outline" (click)="cancel()" [zDisabled]="saving()">Anulare</button>
    <button z-button type="submit" zType="default" [zLoading]="saving()" [zDisabled]="form.invalid || saving()">Salvează</button>
  </div>
</form>
