<z-card zTitle="Echipe" zDescription="Gestionare echipe. Echipele pot fi asignate la lucrări (din detaliu șantier).">
  <div class="mb-4 flex min-w-0 flex-wrap items-center justify-end gap-2">
    <button z-button zType="default" zSize="sm" (click)="openCreate()" class="shrink-0">
      Adaugă echipă
    </button>
  </div>

  @if (loading()) {
    <div class="flex items-center justify-center py-8 sm:py-12">
      <z-loader zSize="lg" />
    </div>
  } @else if (error()) {
    <z-alert zType="destructive" [zDescription]="error()!" />
  } @else {
    <div class="-mx-3 min-w-0 overflow-x-auto sm:mx-0">
      <table z-table class="min-w-[500px]">
        <thead z-table-header>
          <tr z-table-row>
            <th z-table-head>Nume</th>
            <th z-table-head>Șef echipă</th>
            <th z-table-head>Nr. angajați</th>
            <th z-table-head class="w-40 text-right">Acțiuni</th>
          </tr>
        </thead>
        <tbody z-table-body>
          @for (e of echipe(); track e.id) {
            <tr z-table-row>
              <td z-table-cell class="font-medium">{{ e.nume }}</td>
              <td z-table-cell>{{ e.sefEchipaNume || '—' }}</td>
              <td z-table-cell>{{ e.nrAngajati }}</td>
              <td z-table-cell class="text-right">
                <div class="flex flex-wrap justify-end gap-1">
                  <button z-button zType="ghost" zSize="sm" (click)="openEdit(e)">Editează</button>
                  <button z-button zType="destructive" zSize="sm" (click)="deleteEchipa(e)">Șterge</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr z-table-row>
              <td z-table-cell [attr.colspan]="4" class="text-center text-neutral-500">
                Nicio echipă. Adaugă echipe pentru a le asigna la lucrări.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</z-card>
