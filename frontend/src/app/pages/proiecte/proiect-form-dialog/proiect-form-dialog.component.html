<form [formGroup]="form" (ngSubmit)="save()" class="min-w-0 space-y-4">
  <div class="space-y-2">
    <label for="proiect-nume" class="text-sm font-medium text-neutral-700">Nume proiect</label>
    <input z-input id="proiect-nume" formControlName="nume" placeholder="Ex: Bloc A" [zStatus]="form.get('nume')?.invalid && form.get('nume')?.touched ? 'error' : undefined" />
  </div>
  <div class="space-y-2">
    <label for="proiect-client" class="text-sm font-medium text-neutral-700">Client</label>
    <input z-input id="proiect-client" formControlName="client" placeholder="Nume client" [zStatus]="form.get('client')?.invalid && form.get('client')?.touched ? 'error' : undefined" />
  </div>
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="space-y-2">
      <label for="proiect-dataStart" class="text-sm font-medium text-neutral-700">Data start</label>
      <input z-input id="proiect-dataStart" type="date" formControlName="dataStart" [zStatus]="form.get('dataStart')?.invalid && form.get('dataStart')?.touched ? 'error' : undefined" />
    </div>
    <div class="space-y-2">
      <label for="proiect-dataSfarsit" class="text-sm font-medium text-neutral-700">Data sfârșit (opțional)</label>
      <input z-input id="proiect-dataSfarsit" type="date" formControlName="dataSfarsit" />
    </div>
  </div>
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <div class="space-y-2">
      <label for="proiect-stare" class="text-sm font-medium text-neutral-700">Stare</label>
      <select id="proiect-stare" formControlName="stare" class="w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-neutral-900 focus:border-primary focus:outline focus:ring-1 focus:ring-primary">
        <option value="Activ">Activ</option>
        <option value="Încheiat">Încheiat</option>
      </select>
    </div>
    <div class="space-y-2">
      <label for="proiect-buget" class="text-sm font-medium text-neutral-700">Buget (opțional)</label>
      <input z-input id="proiect-buget" type="number" formControlName="buget" placeholder="Ex: 150000" min="0" step="0.01" />
    </div>
    <div class="space-y-2">
      <label for="proiect-moneda" class="text-sm font-medium text-neutral-700">Monedă</label>
      <select id="proiect-moneda" formControlName="moneda" class="w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-neutral-900 focus:border-primary focus:outline focus:ring-1 focus:ring-primary">
        <option value="RON">RON (Lei)</option>
        <option value="EUR">EUR (Euro)</option>
      </select>
    </div>
  </div>
  @if (formError()) {
    <z-alert zType="destructive" [zDescription]="formError()!" />
  }
  <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
    <button z-button type="button" zType="outline" (click)="cancel()" [zDisabled]="saving()">Anulare</button>
    <button z-button type="submit" zType="default" [zLoading]="saving()" [zDisabled]="form.invalid || saving()">Salvează</button>
  </div>
</form>
