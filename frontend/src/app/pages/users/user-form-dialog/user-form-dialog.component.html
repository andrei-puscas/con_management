<form [formGroup]="form" (ngSubmit)="save()" class="min-w-0 space-y-4">
  <div class="grid min-w-0 grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="space-y-2">
      <label for="dialog-user-email" class="text-sm font-medium text-neutral-700">Email</label>
      <input
        z-input
        id="dialog-user-email"
        type="email"
        formControlName="email"
        placeholder="email@exemplu.ro"
        [zStatus]="form.get('email')?.invalid && form.get('email')?.touched ? 'error' : undefined"
      />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <p class="text-sm text-red-600">Introdu un email valid.</p>
      }
    </div>
    <div class="space-y-2">
      <label for="dialog-user-rol" class="text-sm font-medium text-neutral-700">Rol</label>
      <select
        id="dialog-user-rol"
        formControlName="rol"
        class="w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-neutral-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
      >
        @for (r of roles; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>
  </div>
  <div class="space-y-2">
    <label for="dialog-user-password" class="text-sm font-medium text-neutral-700">
      Parolă {{ isEditMode ? '(lasă gol pentru a păstra parola)' : '' }}
    </label>
    <input
      z-input
      id="dialog-user-password"
      type="password"
      formControlName="password"
      placeholder="••••••••"
      [zStatus]="form.get('password')?.invalid && form.get('password')?.touched ? 'error' : undefined"
    />
    @if (form.get('password')?.invalid && form.get('password')?.touched) {
      <p class="text-sm text-red-600">Parola minim 6 caractere.</p>
    }
  </div>
  @if (formError()) {
    <z-alert zType="destructive" [zDescription]="formError()!" />
  }
  <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
    <button z-button type="button" zType="outline" (click)="cancel()" [zDisabled]="saving()" class="w-full sm:w-auto">
      Anulare
    </button>
    <button z-button type="submit" zType="default" [zLoading]="saving()" [zDisabled]="form.invalid || saving()" class="w-full sm:w-auto">
      Salvează
    </button>
  </div>
</form>
