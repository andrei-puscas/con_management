<z-card zTitle="Utilizatori" zDescription="Gestionare utilizatori sistem">
  <div class="mb-4 flex min-w-0 flex-wrap items-center justify-end gap-2">
    <button z-button zType="default" zSize="sm" (click)="openCreate()" class="shrink-0">
      Adaugă utilizator
    </button>
  </div>

  @if (loading()) {
    <div class="flex items-center justify-center py-8 sm:py-12">
      <z-loader zSize="lg" />
    </div>
  } @else if (error()) {
    <z-alert zType="destructive" [zDescription]="error()!" />
  } @else {
    <div class="-mx-3 min-w-0 overflow-x-auto sm:mx-0">
      <table z-table class="min-w-[600px]">
        <thead z-table-header>
          <tr z-table-row>
            <th z-table-head>ID</th>
            <th z-table-head>Email</th>
            <th z-table-head>Rol</th>
            <th z-table-head class="w-40 text-right">Acțiuni</th>
          </tr>
        </thead>
        <tbody z-table-body>
          @for (u of users(); track u.id) {
            <tr z-table-row>
              <td z-table-cell>{{ u.id }}</td>
              <td z-table-cell>{{ u.email }}</td>
              <td z-table-cell>{{ u.rol }}</td>
              <td z-table-cell class="text-right">
                <div class="flex flex-wrap justify-end gap-1">
                  <button z-button zType="ghost" zSize="sm" (click)="openEdit(u)">Editează</button>
                  <button z-button zType="destructive" zSize="sm" (click)="deleteUser(u)">Șterge</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr z-table-row>
              <td z-table-cell colspan="4" class="text-center text-neutral-500">
                Niciun utilizator găsit.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</z-card>
