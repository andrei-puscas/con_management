<div class="relative min-h-screen w-full">
  <!-- Background image full width (Unsplash: construction workers, Scott Blake) -->
  <div
    class="fixed inset-0 w-full bg-cover bg-center bg-no-repeat"
    style="background-image: url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=1920&q=80');"
  ></div>
  <div class="fixed inset-0 w-full bg-neutral-900/50"></div>
  <div class="relative z-10 flex min-h-screen w-full flex-col">
  <header class="w-full border-b border-white/20 bg-white/95 backdrop-blur-sm">
    <div class="mx-auto flex max-w-7xl w-full flex-wrap items-center justify-between gap-2 px-3 py-3 sm:gap-3 sm:px-6 sm:py-4 lg:px-8">
      <h1 class="min-w-0 shrink-0 truncate text-lg font-semibold text-neutral-900 sm:text-xl">ConManagement</h1>

      <nav class="flex min-w-0 flex-wrap items-center justify-end gap-2 sm:gap-3">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" class="shrink-0">
            <button z-button zType="ghost" zSize="sm">Dashboard</button>
          </a>
          <a routerLink="/proiecte" class="shrink-0">
            <button z-button zType="ghost" zSize="sm">Proiecte</button>
          </a>
          <a routerLink="/echipe" class="shrink-0">
            <button z-button zType="ghost" zSize="sm">Echipe</button>
          </a>
          <a routerLink="/angajati" class="shrink-0">
            <button z-button zType="ghost" zSize="sm">Angajați</button>
          </a>
          @if (auth.isAdmin()) {
            <a routerLink="/users" class="shrink-0">
              <button z-button zType="ghost" zSize="sm">Utilizatori</button>
            </a>
          }

          <div class="flex shrink-0 items-center gap-2 border-l border-neutral-200 pl-2 sm:ml-2 sm:pl-3">
            <z-avatar
              [zFallback]="auth.getInitials()"
              zSize="default"
              zStatus="online"
              class="ring-2 ring-primary/20 shadow-md"
              [title]="auth.getEmail() ?? ''"
            />
            <button z-button zType="ghost" zSize="sm" (click)="auth.logout()">
              Deconectare
            </button>
          </div>
        } @else {
          <a routerLink="/login" class="shrink-0">
            <button z-button zType="default" zSize="sm">Autentificare</button>
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto flex-1 w-full max-w-7xl px-3 py-4 sm:px-6 sm:py-6 lg:px-8">
    @if (breadcrumbItems.length) {
      <nav class="mb-4 flex flex-wrap items-center gap-1.5 text-sm text-neutral-200" aria-label="breadcrumb">
        @for (item of breadcrumbItems; track item.label; let last = $last) {
          @if (last) {
            <span class="font-medium text-white">{{ item.label }}</span>
          } @else {
            <a [routerLink]="item.link" class="hover:text-white hover:underline">{{ item.label }}</a>
            <span aria-hidden="true" class="text-neutral-400">/</span>
          }
        }
      </nav>
    }
    <router-outlet />
  </main>
  </div>
</div>
